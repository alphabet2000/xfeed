name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build JS bundles and run unit tests
        run: |
          node scripts/build.mjs
          node --test packages/engine/test/*.test.ts apps/sync-worker/test/*.test.mjs

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Assemble Android Debug APK
        working-directory: apps/android
        run: gradle assembleDebug --stacktrace

      - name: Upload Android Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: xfeed-android-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Desktop Extension Bundle
        uses: actions/upload-artifact@v4
        with:
          name: xfeed-desktop-extension
          path: apps/extension/dist
          if-no-files-found: error
          retention-days: 30
