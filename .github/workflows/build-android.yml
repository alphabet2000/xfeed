name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build JS bundles and run unit tests
        run: |
          node scripts/build.mjs
          node --test packages/engine/test/*.test.ts packages/x-adapter/test/*.test.ts apps/sync-worker/test/*.test.mjs

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Restore consistent Android debug keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
            echo "Restored persistent debug keystore for in-place APK upgrades."
          else
            echo "No ANDROID_DEBUG_KEYSTORE_BASE64 secret configured; using runner default debug keystore."
          fi

      - name: Assemble Android Debug APK
        working-directory: apps/android
        run: gradle assembleDebug -PversionCode=${{ github.run_number }} -PversionName=0.1.${{ github.run_number }} --stacktrace

      - name: Upload Android Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: xfeed-android-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Desktop Extension Bundle
        uses: actions/upload-artifact@v4
        with:
          name: xfeed-desktop-extension
          path: apps/extension/dist
          if-no-files-found: error
          retention-days: 30
